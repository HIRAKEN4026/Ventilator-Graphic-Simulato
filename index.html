<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人工呼吸器グラフィック判読＆介入シミュレーター</title>
<style>
  :root {
    --bg-dark: #0b1120;
    --panel-bg: #1e293b;
    --border-col: #334155;
    --text-main: #f8fafc;
    --text-sub: #94a3b8;
    --paw-col: #facc15;
    --flow-col: #38bdf8;
    --vol-col: #4ade80;
    --accent: #3b82f6;
    --correct: #22c55e;
    --wrong: #ef4444;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100%;
    overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    line-height: 1.45;
    font-size: 15px;
  }
  body { padding: 10px; }

  .sim-wrapper {
    max-width: 1600px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }

  .sim-header {
    background: var(--panel-bg);
    border: 1px solid var(--border-col);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .header-top {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .sim-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge-mode {
    background: linear-gradient(135deg, #0284c7, #0369a1);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 700;
    color: #fff;
    border: 1px solid #38bdf8;
    white-space: nowrap;
  }

  .controls-grid {
    display: grid;
    grid-template-columns: 1.5fr 1.3fr 1fr;
    gap: 10px;
    align-items: end;
  }
  .ctrl-box {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .ctrl-label {
    font-size: 0.75rem;
    color: var(--text-sub);
    font-weight: 600;
  }
  select, button {
    font-family: inherit;
    font-size: 0.88rem;
    border-radius: 8px;
    border: 1px solid var(--border-col);
    background: #0f172a;
    color: #fff;
    padding: 9px 10px;
    cursor: pointer;
    min-height: 40px;
  }
  select {
    width: 100%;
    text-overflow: ellipsis;
  }

  .mode-selector-group {
    display: flex;
    gap: 6px;
    flex-wrap: nowrap;
  }
  .seg-group {
    display: flex;
    background: #0f172a;
    padding: 3px;
    border-radius: 8px;
    border: 1px solid var(--border-col);
    flex: 1;
  }
  .seg-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-sub);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 6px 4px;
    min-height: 32px;
    border-radius: 6px;
    transition: 0.15s;
    white-space: nowrap;
  }
  .seg-btn.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 6px rgba(59, 130, 246, 0.4);
  }
  .seg-btn.ctrl-active {
    background: #0d9488;
    color: #fff;
    box-shadow: 0 2px 6px rgba(13, 148, 136, 0.4);
  }
  .seg-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    background: transparent !important;
    box-shadow: none !important;
    color: #64748b !important;
  }

  .ctrl-btn-group {
    display: flex;
    gap: 6px;
  }
  .ctrl-btn-group button {
    flex: 1;
    font-weight: 700;
    font-size: 0.8rem;
    padding: 8px 6px;
    white-space: nowrap;
  }
  .btn-resolve {
    background: #059669;
    border-color: #10b981;
  }
  .btn-resolve.active-overlay {
    background: #d97706;
    border-color: #fbbf24;
  }

  .sim-grid {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 14px;
    width: 100%;
    align-items: start;
  }

  .monitor-panel {
    background: #030712;
    border: 2px solid var(--border-col);
    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    overflow: hidden;
  }
  .alarm-banner {
    background: rgba(239, 68, 68, 0.22);
    border: 1px solid var(--wrong);
    color: #fca5a5;
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 0.85rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    animation: pulse-alarm 1.6s infinite;
  }
  .alarm-banner.resolved {
    background: rgba(34, 197, 94, 0.22);
    border-color: var(--correct);
    color: #86efac;
    animation: none;
  }
  .status-sub {
    font-size: 0.76rem;
    color: #e2e8f0;
    font-weight: 600;
    background: rgba(15, 23, 42, 0.7);
    padding: 2px 8px;
    border-radius: 4px;
  }
  @keyframes pulse-alarm {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  .vitals-strip {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px;
    background: #111827;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #1f2937;
    width: 100%;
  }
  .vital-box {
    background: #030712;
    border: 1px solid #1e293b;
    border-radius: 6px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    min-width: 0;
  }
  .vital-label {
    font-size: 0.72rem;
    color: var(--text-sub);
    font-weight: 600;
    text-align: center;
    width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .vital-val {
    font-size: clamp(0.95rem, 1.4vw, 1.3rem);
    font-weight: 800;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    text-align: center;
    width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin: 3px 0;
  }
  .vital-unit {
    font-size: 0.68rem;
    color: var(--text-sub);
  }

  .canvas-container {
    width: 100%;
    height: 440px;
    position: relative;
    background: #050811;
    border: 1px solid #1e293b;
    border-radius: 6px;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .interaction-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }
  .visual-card, .quiz-card {
    background: var(--panel-bg);
    border: 1px solid var(--border-col);
    border-radius: 10px;
    padding: 12px;
    width: 100%;
  }
  .card-title {
    font-size: 0.92rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: #e2e8f0;
    border-bottom: 1px solid var(--border-col);
    padding-bottom: 6px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .physical-sign-badge {
    font-size: 0.78rem;
    color: #38bdf8;
    font-weight: 600;
  }

  .patient-svg-wrap {
    width: 100%;
    height: 185px;
    background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
    border-radius: 8px;
    border: 1px solid var(--border-col);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .level-switch-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0f172a;
    border: 1px solid var(--border-col);
    border-radius: 8px;
    padding: 6px 10px;
    margin-bottom: 10px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .level-label {
    font-size: 0.78rem;
    color: #cbd5e1;
    font-weight: 700;
  }
  .level-btn-group {
    display: flex;
    gap: 4px;
    flex: 1;
    min-width: 220px;
  }
  .lvl-btn {
    flex: 1;
    min-height: 32px;
    padding: 5px 8px;
    font-size: 0.76rem;
    font-weight: 700;
    border-radius: 6px;
    border: 1px solid var(--border-col);
    background: #1e293b;
    color: var(--text-sub);
    transition: 0.15s;
  }
  .lvl-btn.active {
    background: #8b5cf6;
    border-color: #a78bfa;
    color: #fff;
  }

  .tab-header {
    display: flex;
    border-bottom: 2px solid var(--border-col);
    margin-bottom: 10px;
    gap: 4px;
  }
  .tab-btn {
    flex: 1;
    background: #0f172a;
    border: 1px solid var(--border-col);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    padding: 9px 4px;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text-sub);
    text-align: center;
    min-height: 38px;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .tab-badge {
    display: inline-block;
    margin-left: 3px;
    padding: 1px 5px;
    border-radius: 10px;
    font-size: 0.68rem;
    background: rgba(0,0,0,0.35);
  }
  .tab-content {
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  .tab-content.active { display: flex; }

  .option-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: #0f172a;
    border: 1px solid var(--border-col);
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1.4;
    transition: 0.15s;
  }
  .option-item:hover { border-color: #64748b; }
  .option-item.selected {
    border-color: var(--accent);
    background: rgba(59, 130, 246, 0.18);
  }
  .option-item.correct-highlight {
    border-color: var(--correct);
    background: rgba(34, 197, 94, 0.18);
  }
  .option-item.wrong-highlight {
    border-color: var(--wrong);
    background: rgba(239, 68, 68, 0.18);
  }
  .option-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin-top: 2px;
    flex-shrink: 0;
    accent-color: var(--accent);
  }

  .hint-card {
    background: #0f172a;
    border: 1px solid var(--border-col);
    border-left: 4px solid #a855f7;
    border-radius: 8px;
    padding: 12px;
    font-size: 0.86rem;
    line-height: 1.55;
    color: #e2e8f0;
  }
  .hint-card-title {
    font-weight: 700;
    color: #c084fc;
    margin-bottom: 6px;
    font-size: 0.9rem;
  }

  .action-bar {
    margin-top: 12px;
    display: flex;
    gap: 8px;
  }
  .btn-intervene {
    flex: 1;
    padding: 12px 10px;
    font-size: 0.92rem;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    border: none;
    color: #fff;
    font-weight: 700;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.35);
    transition: 0.2s;
  }
  .btn-intervene:disabled {
    background: #334155;
    color: #94a3b8;
    box-shadow: none;
    cursor: not-allowed;
    opacity: 0.75;
  }

  .feedback-panel {
    margin-top: 12px;
    padding: 12px;
    border-radius: 8px;
    background: #0f172a;
    border: 1px solid var(--border-col);
    display: none;
    font-size: 0.85rem;
  }
  .feedback-panel.show { display: block; }
  .fb-header {
    font-size: 0.96rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .fb-reason-list {
    margin-top: 6px;
    padding-left: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  @media (max-width: 1100px) {
    .sim-grid { grid-template-columns: 1fr; }
    .controls-grid { grid-template-columns: 1fr 1fr; }
    .controls-grid > .ctrl-box:first-child { grid-column: span 2; }
  }

  @media (max-width: 640px) {
    body { padding: 6px; }
    .controls-grid { grid-template-columns: 1fr; gap: 8px; }
    .controls-grid > .ctrl-box:first-child { grid-column: span 1; }
    .mode-selector-group { flex-direction: column; gap: 6px; }

    .vitals-strip {
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 5px;
      padding: 6px;
    }
    .vital-box:nth-child(1),
    .vital-box:nth-child(2),
    .vital-box:nth-child(3) {
      grid-column: span 2;
    }
    .vital-box:nth-child(4),
    .vital-box:nth-child(5) {
      grid-column: span 3;
    }
    .vital-val { font-size: 0.92rem; }
    .canvas-container { height: 320px; }
    .patient-svg-wrap { height: 160px; }
    .action-bar { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="sim-wrapper">
  <header class="sim-header">
    <div class="header-top">
      <div class="sim-title">
        <span>🫁 人工呼吸器グラフィック判読＆介入シミュレーター</span>
      </div>
      <span id="ventModeBadge" class="badge-mode">現在設定: A/C - PCV</span>
    </div>

    <div class="controls-grid">
      <div class="ctrl-box">
        <label for="scenarioSelect" class="ctrl-label">▼ 症例波形（全12種）を選択:</label>
        <select id="scenarioSelect"></select>
      </div>

      <div class="ctrl-box">
        <span class="ctrl-label">▼ 換気モード ＆ 制御パターン切替（症例連動）:</span>
        <div class="mode-selector-group">
          <div class="seg-group" id="modeSegGroup">
            <button type="button" class="seg-btn active" data-mode="AC">A/C</button>
            <button type="button" class="seg-btn" data-mode="SIMV">SIMV</button>
            <button type="button" class="seg-btn" data-mode="CPAP_PS">CPAP+PSV</button>
          </div>
          <div class="seg-group" id="ctrlSegGroup" style="max-width:130px;">
            <button type="button" class="seg-btn ctrl-active" data-ctrl="PCV">PCV</button>
            <button type="button" class="seg-btn" data-ctrl="VCV">VCV</button>
          </div>
        </div>
      </div>

      <div class="ctrl-box">
        <span class="ctrl-label">▼ 波形比較・再生コントロール:</span>
        <div class="ctrl-btn-group">
          <button id="toggleNormalBtn" class="btn-resolve" type="button">正常比較(実線): OFF</button>
          <button id="pauseWaveBtn" type="button">⏸ 停止</button>
        </div>
      </div>
    </div>
  </header>

  <div class="sim-grid">
    <section class="monitor-panel">
      <div id="alarmBanner" class="alarm-banner">
        <span id="alarmText">⚠️ 波形異常・非同調を検出</span>
        <span id="simStatusLabel" class="status-sub">状態: 介入前（異常波形）</span>
      </div>

      <div class="vitals-strip">
        <div class="vital-box">
          <div class="vital-label">Ppeak (最高圧)</div>
          <div id="valPpeak" class="vital-val" style="color:var(--paw-col);">22</div>
          <div class="vital-unit">cmH2O</div>
        </div>
        <div class="vital-box">
          <div class="vital-label">PEEP</div>
          <div id="valPeep" class="vital-val" style="color:var(--paw-col);">5.0</div>
          <div class="vital-unit">cmH2O</div>
        </div>
        <div class="vital-box">
          <div class="vital-label">EtCO2</div>
          <div id="valEtco2" class="vital-val" style="color:#f472b6;">38</div>
          <div class="vital-unit">mmHg</div>
        </div>
        <div class="vital-box">
          <div class="vital-label">VTi / VTe (換気量)</div>
          <div id="valVt" class="vital-val" style="color:var(--vol-col);">450 / 450</div>
          <div class="vital-unit">mL</div>
        </div>
        <div class="vital-box">
          <div class="vital-label">fTOT (総呼吸/設定)</div>
          <div id="valRr" class="vital-val" style="color:var(--flow-col);">15 / 15</div>
          <div class="vital-unit">回/min</div>
        </div>
      </div>

      <div class="canvas-container">
        <canvas id="waveCanvas" width="700" height="400"></canvas>
      </div>
    </section>

    <section class="interaction-panel">
      <div class="visual-card">
        <div class="card-title">
          <span>🔍 ベッドサイド身体所見・人工呼吸器回路シェーマ</span>
          <span id="physicalSignText" class="physical-sign-badge"></span>
        </div>
        <div class="patient-svg-wrap" id="svgAnimContainer"></div>
      </div>

      <div class="quiz-card">
        <div class="level-switch-bar">
          <span class="level-label">👥 表現・解説レベル切替:</span>
          <div class="level-btn-group" id="expLevelGroup">
            <button type="button" class="lvl-btn active" data-level="novice">🌱 新人看護師向け</button>
            <button type="button" class="lvl-btn" data-level="expert">🎓 5年目以上向け</button>
          </div>
        </div>

        <div class="tab-header">
          <button class="tab-btn active" data-tab="causeTab" type="button">
            発生要因 <span id="badgeCause" class="tab-badge">未選択</span>
          </button>
          <button class="tab-btn" data-tab="actionTab" type="button">
            対処法 <span id="badgeAction" class="tab-badge">未選択</span>
          </button>
          <button class="tab-btn" data-tab="hintTab" type="button">
            💡 ヒント
          </button>
        </div>

        <div id="causeTab" class="tab-content active"></div>
        <div id="actionTab" class="tab-content"></div>

        <div id="hintTab" class="tab-content">
          <div class="hint-card">
            <div id="hintLevelTitle" class="hint-card-title">🌱 新人看護師向け：波形の見かたヒント</div>
            <p id="hintFeatureText"></p>
          </div>
        </div>

        <div class="action-bar">
          <button id="interveneBtn" class="btn-intervene" type="button" disabled>
            🔒 「発生要因」と「対処法」を選択すると介入できます
          </button>
          <button id="resetQuizBtn" type="button">🔄 リセット</button>
        </div>

        <div id="feedbackPanel" class="feedback-panel"></div>
      </div>
    </section>
  </div>
</div>

<script>
const SCENARIOS_PART1 = [
  {
    id: "1-1",
    category: "1. トリガー関連の非同調",
    title: "① ミストリガー（Missed Trigger）",
    defaultMode: "AC", defaultCtrl: "PCV",
    allowedModes: ["AC", "SIMV", "CPAP_PS"],
    allowedCtrls: ["PCV", "VCV"],
    alarm: "⚠️ 換気回数低下傾向 / 吸気補助筋使用・シーソー呼吸",
    physicalSign: "胸郭・横隔膜が吸気努力で動くが、送気が開始されない箇所あり",
    vitals: { ppeak: 18, peep: "5.0", vti: 450, vte: 450, rr: "12/12(努24)", etco2: 46 },
    hintNovice: "患者さんが息を吸おうとして胸やお腹が動いているのに、呼吸器が気づいていない状態です。息を吐いている途中の水色の線（流量波形）がポコッと上に膨らんだり、黄色の線（圧波形）が下にへこんだりしているのに、次の送気の山が始まらないのが特徴です。",
    hintExpert: "呼気相の流量波形に“上に凸”の小さなサインカーブ、気道内圧波形に“下に凸”の陰圧陥凹（吸気努力）が出現しているにもかかわらず、トリガー閾値に達せず機械送気が開始されない無効吸気努力（Ineffective Effort）の波形です。",
    animType: "missed_trigger",
    causes: [
      {
        id: "c1", isCorrect: true,
        textNovice: "呼吸器が「息を吸い始めた」と気づくための感度（トリガー感度）が鈍すぎる",
        textExpert: "吸気トリガー感度（圧・フロートリガー閾値）の設定が鈍すぎる",
        reason: "トリガー閾値に患者の吸気努力が届かず、人工呼吸器が自発呼吸を感知できていません。"
      },
      {
        id: "c2", isCorrect: true,
        textNovice: "鎮静薬が効きすぎている、または呼吸する筋肉が疲れていて吸う力が弱い",
        textExpert: "過鎮静や呼吸筋疲労・神経筋疾患による自発吸気ドライブ・吸気筋力の減弱",
        reason: "吸気フローや陰圧変化が小さくなると、設定感度に達していません。"
      },

<script>
let currentScenarioIndex = 0;
let currentMode = "AC";
let currentCtrl = "PCV";
let currentLevel = "novice";
let isNormalOverlay = false;
let isResolved = false;
let isPaused = false;
let animTime = 0;
let selectedCauses = new Set();
let selectedActions = new Set();
let hasEvaluated = false;
let canvasLogicalW = 700;
let canvasLogicalH = 400;

const scenarioSelect = document.getElementById("scenarioSelect");
const ventModeBadge = document.getElementById("ventModeBadge");
const toggleNormalBtn = document.getElementById("toggleNormalBtn");
const pauseWaveBtn = document.getElementById("pauseWaveBtn");
const alarmBanner = document.getElementById("alarmBanner");
const alarmText = document.getElementById("alarmText");
const simStatusLabel = document.getElementById("simStatusLabel");
const physicalSignText = document.getElementById("physicalSignText");
const svgAnimContainer = document.getElementById("svgAnimContainer");
const causeTab = document.getElementById("causeTab");
const actionTab = document.getElementById("actionTab");
const badgeCause = document.getElementById("badgeCause");
const badgeAction = document.getElementById("badgeAction");
const hintLevelTitle = document.getElementById("hintLevelTitle");
const hintFeatureText = document.getElementById("hintFeatureText");
const interveneBtn = document.getElementById("interveneBtn");
const resetQuizBtn = document.getElementById("resetQuizBtn");
const feedbackPanel = document.getElementById("feedbackPanel");
const waveCanvas = document.getElementById("waveCanvas");
const ctx = waveCanvas ? waveCanvas.getContext("2d") : null;

function resizeCanvasSafely() {
  if (!waveCanvas || !ctx) return;
  const parent = waveCanvas.parentElement;
  if (!parent) return;
  const rect = parent.getBoundingClientRect();
  const w = Math.max(280, Math.floor(rect.width));
  const h = Math.max(240, Math.floor(rect.height));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvasLogicalW = w;
  canvasLogicalH = h;
  waveCanvas.width = w * dpr;
  waveCanvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function initSimulator() {
  if (!scenarioSelect) return;

  const categories = {};
  SCENARIOS.forEach((sc, idx) => {
    if (!categories[sc.category]) categories[sc.category] = [];
    categories[sc.category].push({ ...sc, idx });
  });

  scenarioSelect.innerHTML = "";
  Object.keys(categories).forEach(catName => {
    const optGroup = document.createElement("optgroup");
    optGroup.label = catName;
    categories[catName].forEach(item => {
      const opt = document.createElement("option");
      opt.value = item.idx;
      opt.textContent = item.title;
      optGroup.appendChild(opt);
    });
    scenarioSelect.appendChild(optGroup);
  });

  scenarioSelect.addEventListener("change", (e) => {
    loadScenario(parseInt(e.target.value, 10) || 0);
  });

  document.querySelectorAll("#modeSegGroup .seg-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.disabled) return;
      currentMode = btn.getAttribute("data-mode") || "AC";
      syncModeButtonsUI();
    });
  });

  document.querySelectorAll("#ctrlSegGroup .seg-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.disabled) return;
      currentCtrl = btn.getAttribute("data-ctrl") || "PCV";
      syncModeButtonsUI();
    });
  });

  document.querySelectorAll("#expLevelGroup .lvl-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#expLevelGroup .lvl-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentLevel = btn.getAttribute("data-level") || "novice";
      refreshLevelTexts();
    });
  });

  if (toggleNormalBtn) {
    toggleNormalBtn.addEventListener("click", () => {
      isNormalOverlay = !isNormalOverlay;
      toggleNormalBtn.textContent = isNormalOverlay ? "正常比較(実線): ON" : "正常比較(実線): OFF";
      toggleNormalBtn.classList.toggle("active-overlay", isNormalOverlay);
    });
  }

  if (pauseWaveBtn) {
    pauseWaveBtn.addEventListener("click", () => {
      isPaused = !isPaused;
      pauseWaveBtn.textContent = isPaused ? "▶️ 再開" : "⏸ 停止";
    });
  }

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      const targetId = btn.getAttribute("data-tab");
      const targetEl = document.getElementById(targetId);
      if (targetEl) targetEl.classList.add("active");
    });
  });

  if (interveneBtn) interveneBtn.addEventListener("click", evaluateIntervention);
  if (resetQuizBtn) resetQuizBtn.addEventListener("click", () => loadScenario(currentScenarioIndex));

  window.addEventListener("resize", resizeCanvasSafely);
  resizeCanvasSafely();
  loadScenario(0);
  requestAnimationFrame(renderLoop);
}

function syncModeButtonsUI() {
  const sc = SCENARIOS[currentScenarioIndex];
  if (!sc) return;

  const allowedModes = sc.allowedModes || ["AC", "SIMV", "CPAP_PS"];
  const allowedCtrls = sc.allowedCtrls || ["PCV", "VCV"];

  if (!allowedModes.includes(currentMode)) {
    currentMode = allowedModes[0];
  }
  if (!allowedCtrls.includes(currentCtrl)) {
    currentCtrl = allowedCtrls[0];
  }

  document.querySelectorAll("#modeSegGroup .seg-btn").forEach(b => {
    const m = b.getAttribute("data-mode");
    const isAllowed = allowedModes.includes(m);
    b.disabled = !isAllowed;
    b.classList.toggle("active", isAllowed && m === currentMode);
  });

  const isCpapPs = (currentMode === "CPAP_PS");
  document.querySelectorAll("#ctrlSegGroup .seg-btn").forEach(b => {
    const c = b.getAttribute("data-ctrl");
    const isAllowed = !isCpapPs && allowedCtrls.includes(c);
    b.disabled = !isAllowed;
    b.classList.toggle("ctrl-active", isAllowed && c === currentCtrl);
  });

  const modeNameMap = {
    "AC": "A/C",
    "SIMV": "SIMV+PS",
    "CPAP_PS": "CPAP+PSV"
  };
  const ctrlLabel = (currentMode === "CPAP_PS")
    ? `${currentCtrl}パターン比較`
    : currentCtrl;

  if (ventModeBadge) {
    if (isCpapPs) {
      ventModeBadge.textContent = `現在設定: ${modeNameMap[currentMode]} (自発呼吸モード)`;
    } else {
      ventModeBadge.textContent = `現在設定: ${modeNameMap[currentMode]} - ${currentCtrl}`;
    }
  }
}

function loadScenario(index) {
  currentScenarioIndex = index;
  const sc = SCENARIOS[index];
  if (!sc) return;

  isResolved = false;
  hasEvaluated = false;
  selectedCauses.clear();
  selectedActions.clear();

  currentMode = sc.defaultMode || "AC";
  currentCtrl = sc.defaultCtrl || "PCV";
  syncModeButtonsUI();

  if (alarmBanner) alarmBanner.classList.remove("resolved");
  if (alarmText) alarmText.textContent = sc.alarm;
  if (simStatusLabel) simStatusLabel.textContent = "状態: 介入前（異常波形）";
  if (physicalSignText) physicalSignText.textContent = sc.physicalSign;

  updateVitalsDisplay(sc.vitals, false);

  renderOptions(causeTab, sc.causes, selectedCauses, "cause");
  renderOptions(actionTab, sc.actions, selectedActions, "action");
  updateHintDisplay(sc);
  updateSelectionCounter();

  if (feedbackPanel) {
    feedbackPanel.className = "feedback-panel";
    feedbackPanel.innerHTML = "";
  }

  buildDetailedCircuitSVG();
}

function refreshLevelTexts() {
  const sc = SCENARIOS[currentScenarioIndex];
  if (!sc) return;

  sc.causes.forEach(item => {
    const span = document.getElementById(`text-cause-${item.id}`);
    if (span) {
      span.textContent = (currentLevel === "novice") ? item.textNovice : item.textExpert;
    }
  });

  sc.actions.forEach(item => {
    const span = document.getElementById(`text-action-${item.id}`);
    if (span) {
      span.textContent = (currentLevel === "novice") ? item.textNovice : item.textExpert;
    }
  });

  updateHintDisplay(sc);

  if (hasEvaluated) {
    evaluateIntervention();
  }
}

function updateHintDisplay(sc) {
  if (!hintLevelTitle || !hintFeatureText) return;
  if (currentLevel === "novice") {
    hintLevelTitle.textContent = "🌱 新人看護師向け：波形の特徴と観察ポイント";
    hintFeatureText.textContent = sc.hintNovice;
  } else {
    hintLevelTitle.textContent = "🎓 5年目以上向け：呼吸生理・メカニクスと波形解析";
    hintFeatureText.textContent = sc.hintExpert;
  }
}

function updateVitalsDisplay(vitals, resolved) {
  const elPpeak = document.getElementById("valPpeak");
  const elPeep = document.getElementById("valPeep");
  const elVt = document.getElementById("valVt");
  const elRr = document.getElementById("valRr");
  const elEtco2 = document.getElementById("valEtco2");

  if (!resolved) {
    if (elPpeak) elPpeak.textContent = vitals.ppeak;
    if (elPeep) elPeep.textContent = vitals.peep;
    if (elVt) elVt.textContent = `${vitals.vti} / ${vitals.vte}`;
    if (elRr) elRr.textContent = vitals.rr;
    if (elEtco2) elEtco2.textContent = vitals.etco2;
  } else {
    if (elPpeak) elPpeak.textContent = (currentMode !== "CPAP_PS" && currentCtrl === "VCV") ? "20" : "18";
    if (elPeep) elPeep.textContent = "5.0";
    if (elVt) elVt.textContent = "450 / 450";
    if (elRr) elRr.textContent = "15 / 15";
    if (elEtco2) elEtco2.textContent = "38";
  }
}

function renderOptions(container, items, selectedSet, groupPrefix) {
  if (!container) return;
  container.innerHTML = "";
  items.forEach(item => {
    const label = document.createElement("label");
    label.className = "option-item";
    label.id = `opt-${groupPrefix}-${item.id}`;

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = item.id;
    checkbox.checked = selectedSet.has(item.id);

    checkbox.addEventListener("change", () => {
      if (checkbox.checked) {
        selectedSet.add(item.id);
        label.classList.add("selected");
      } else {
        selectedSet.delete(item.id);
        label.classList.remove("selected");
      }
      updateSelectionCounter();
    });

    const span = document.createElement("span");
    span.id = `text-${groupPrefix}-${item.id}`;
    span.textContent = (currentLevel === "novice") ? item.textNovice : item.textExpert;

    label.appendChild(checkbox);
    label.appendChild(span);
    container.appendChild(label);
  });
}

function updateSelectionCounter() {
  const cCount = selectedCauses.size;
  const aCount = selectedActions.size;

  if (badgeCause) {
    badgeCause.textContent = cCount > 0 ? "選択済" : "未選択";
    badgeCause.style.background = cCount > 0 ? "#16a34a" : "rgba(0,0,0,0.35)";
  }
  if (badgeAction) {
    badgeAction.textContent = aCount > 0 ? "選択済" : "未選択";
    badgeAction.style.background = aCount > 0 ? "#16a34a" : "rgba(0,0,0,0.35)";
  }

  if (interveneBtn) {
    if (cCount > 0 && aCount > 0) {
      interveneBtn.disabled = false;
      interveneBtn.textContent = "💉 選択した内容で介入する（正誤判定）";
    } else if (cCount === 0 && aCount === 0) {
      interveneBtn.disabled = true;
      interveneBtn.textContent = "🔒 「発生要因」と「対処法」を選択すると介入できます";
    } else if (cCount === 0) {
      interveneBtn.disabled = true;
      interveneBtn.textContent = "🔒 あと「発生要因」タブを選択してください";
    } else {
      interveneBtn.disabled = true;
      interveneBtn.textContent = "🔒 あと「対処法」タブを選択してください";
    }
  }
}

function evaluateIntervention() {
  const sc = SCENARIOS[currentScenarioIndex];
  if (!sc || !feedbackPanel) return;

  hasEvaluated = true;
  let allCorrect = true;
  const causeFeedbackHtml = [];
  const actionFeedbackHtml = [];

  sc.causes.forEach(c => {
    const el = document.getElementById(`opt-cause-${c.id}`);
    if (el) el.classList.remove("correct-highlight", "wrong-highlight");
    const isChecked = selectedCauses.has(c.id);
    const dispText = (currentLevel === "novice") ? c.textNovice : c.textExpert;

    if (c.isCorrect && isChecked) {
      if (el) el.classList.add("correct-highlight");
      causeFeedbackHtml.push(`<li><strong style="color:#4ade80;">✅ [正解]</strong> ${dispText}<br><span style="color:#cbd5e1;font-size:0.8rem;">理由: ${c.reason}</span></li>`);
    } else if (c.isCorrect && !isChecked) {
      allCorrect = false;
      if (el) el.classList.add("correct-highlight");
      causeFeedbackHtml.push(`<li><strong style="color:#facc15;">⚠️ [選択漏れ（該当する要因）]</strong> ${dispText}<br><span style="color:#cbd5e1;font-size:0.8rem;">理由: ${c.reason}</span></li>`);
    } else if (!c.isCorrect && isChecked) {
      allCorrect = false;
      if (el) el.classList.add("wrong-highlight");
      causeFeedbackHtml.push(`<li><strong style="color:#f87171;">❌ [誤選択]</strong> ${dispText}<br><span style="color:#fca5a5;font-size:0.8rem;">理由: ${c.reason}</span></li>`);
    }
  });

  sc.actions.forEach(a => {
    const el = document.getElementById(`opt-action-${a.id}`);
    if (el) el.classList.remove("correct-highlight", "wrong-highlight");
    const isChecked = selectedActions.has(a.id);
    const dispText = (currentLevel === "novice") ? a.textNovice : a.textExpert;

    if (a.isCorrect && isChecked) {
      if (el) el.classList.add("correct-highlight");
      actionFeedbackHtml.push(`<li><strong style="color:#4ade80;">✅ [適切な対処]</strong> ${dispText}<br><span style="color:#cbd5e1;font-size:0.8rem;">根拠: ${a.reason}</span></li>`);
    } else if (a.isCorrect && !isChecked) {
      allCorrect = false;
      if (el) el.classList.add("correct-highlight");
      actionFeedbackHtml.push(`<li><strong style="color:#facc15;">⚠️ [選択漏れ（推奨される対処）]</strong> ${dispText}<br><span style="color:#cbd5e1;font-size:0.8rem;">根拠: ${a.reason}</span></li>`);

  });

  feedbackPanel.className = "feedback-panel show";
  if (allCorrect) {
    isResolved = true;
    if (alarmBanner) alarmBanner.classList.add("resolved");
    if (alarmText) alarmText.textContent = "✅ 介入成功：非同調・異常波形が解消され、患者と人工呼吸器が同調しています";
    if (simStatusLabel) simStatusLabel.textContent = "状態: 改善（正常同調波形へ移行）";
    updateVitalsDisplay(sc.vitals, true);

    feedbackPanel.innerHTML = `
      <div class="fb-header" style="color:#4ade80;">🎉 完全正解！適切なアセスメントと臨床介入により波形が正常化しました</div>
      <div style="margin-top:6px;"><strong>【発生要因の振り返り】</strong><ul class="fb-reason-list">${causeFeedbackHtml.join("")}</ul></div>
      <div style="margin-top:10px;"><strong>【対処法の振り返り】</strong><ul class="fb-reason-list">${actionFeedbackHtml.join("")}</ul></div>
    `;
  } else {
    isResolved = false;
    if (alarmBanner) alarmBanner.classList.remove("resolved");
    if (alarmText) alarmText.textContent = "⚠️ 一部不適切な選択または見落としがあります（理由を確認し再介入してください）";
    if (simStatusLabel) simStatusLabel.textContent = "状態: 異常持続（再評価が必要）";
    updateVitalsDisplay(sc.vitals, false);

    feedbackPanel.innerHTML = `
      <div class="fb-header" style="color:#f87171;">❌ 不正解または選択漏れがあります（異常波形が持続しています）</div>
      <p style="font-size:0.8rem;color:#cbd5e1;margin-bottom:6px;">緑枠が選ぶべき項目、赤枠が誤って選択した項目です。以下の根拠を確認してチェックを修正し、再度「介入する」ボタンを押してください。</p>
      <div style="margin-top:6px;"><strong>【発生要因の判定と理由】</strong><ul class="fb-reason-list">${causeFeedbackHtml.join("")}</ul></div>
      <div style="margin-top:10px;"><strong>【対処法の判定と理由】</strong><ul class="fb-reason-list">${actionFeedbackHtml.join("")}</ul></div>
    `;
  }
}

function computeBreathWaveforms(tSec, animType, forceNormal, mode, ctrl) {
  const cyclePeriod = (animType === "auto_trigger") ? 1.6 : (animType === "auto_peep" ? 2.1 : 3.2);
  const breathIndex = Math.floor(tSec / cyclePeriod);
  const ph = (tSec % cyclePeriod) / cyclePeriod;

  const isSimvPsBreath = (mode === "SIMV" && (breathIndex % 2 === 1));
  const isSpontPs = (mode === "CPAP_PS" || isSimvPsBreath);
  const useVcvShape = (ctrl === "VCV" && !isSpontPs);

  function getBaseInsp(ip, targetPeakP, targetVt, hasTriggerDip) {
    const dip = hasTriggerDip && ip < 0.14 ? -2.2 * Math.sin((ip / 0.14) * Math.PI) : 0;
    const eff = hasTriggerDip && ip < 0.35 ? Math.sin((ip / 0.35) * Math.PI) * 0.65 : 0;
    if (useVcvShape) {
      return {
        paw: 5.0 + dip + (targetPeakP - 5.0) * (0.32 + 0.68 * ip),
        flow: 52,
        vol: targetVt * ip,
        effort: eff
      };
    } else {
      const pGain = isSpontPs ? (targetPeakP - 3.5) : targetPeakP;
      const vGain = isSpontPs ? (targetVt * 0.84) : targetVt;
      return {
        paw: 5.0 + dip + (pGain - 5.0) * (1 - Math.exp(-ip * 9)),
        flow: 66 * Math.exp(-ip * (isSpontPs ? 2.9 : 2.4)),
        vol: vGain * (1 - Math.exp(-ip * 2.8)) / (1 - Math.exp(-2.8)),
        effort: eff
      };
    }
  }

  if (forceNormal || animType === "normal") {
    const inspRatio = isSpontPs ? 0.30 : 0.33;
    if (ph < inspRatio) {
      const ip = ph / inspRatio;
      const hasDip = (mode === "CPAP_PS" || isSimvPsBreath || (mode === "AC" && breathIndex % 2 === 0));
      const b = getBaseInsp(ip, 19, 450, hasDip);
      return { paw: b.paw, flow: b.flow, vol: b.vol, patientEffort: b.effort };
    } else {
      const ep = (ph - inspRatio) / (1 - inspRatio);
      const vMax = isSpontPs ? 380 : 450;
      return {
        paw: 5.0,
        flow: -58 * Math.exp(-ep * 4.6),
        vol: vMax * Math.exp(-ep * 4.6),
        patientEffort: 0
      };
    }
  }

  if (animType === "missed_trigger") {
    if (ph < 0.30) {
      const b = getBaseInsp(ph / 0.30, 18, 450, isSpontPs);
      return { paw: b.paw, flow: b.flow, vol: b.vol, patientEffort: b.effort };
    } else {
      const ep = (ph - 0.30) / 0.70;
      let paw = 5.0;
      let flow = -55 * Math.exp(-ep * 4.3);
      let vol = (isSpontPs ? 380 : 450) * Math.exp(-ep * 4.3);
      let effort = 0;
      if (ep > 0.44 && ep < 0.68) {
        const bump = Math.sin(((ep - 0.44) / 0.24) * Math.PI);
        effort = bump;
        paw -= 3.5 * bump;
        flow += 26 * bump;
      }
      return { paw, flow, vol, patientEffort: effort };
    }
  }

  if (animType === "auto_trigger") {
    const osc = Math.sin(tSec * 28) * 1.3;
    if (ph < 0.42) {
      const b = getBaseInsp(ph / 0.42, 18, 440, false);
      return { paw: b.paw + osc * 0.4, flow: b.flow + osc * 3, vol: b.vol, patientEffort: 0 };
    } else {
      const ep = (ph - 0.42) / 0.58;
      return {
        paw: 5.0 + osc,
        flow: -55 * Math.exp(-ep * 3.3) + osc * 5,
        vol: 440 * Math.exp(-ep * 3.3),
        patientEffort: 0
      };
    }
  }

  if (animType === "double_trigger") {
    if (ph < 0.22) {
      const b = getBaseInsp(ph / 0.22, 21, 390, true);
      return { paw: b.paw, flow: b.flow, vol: b.vol, patientEffort: 0.9 };
    } else if (ph < 0.26) {
      const tr = (ph - 0.22) / 0.04;
      return { paw: 5.0 - 3.2 * Math.sin(tr * Math.PI), flow: -12 * (1 - tr), vol: 380, patientEffort: 1.0 };
    } else if (ph < 0.48) {
      const ip2 = (ph - 0.26) / 0.22;
      const paw2 = useVcvShape ? (20 + 19 * ip2) : (5 + 24 * (1 - Math.exp(-ip2 * 8)));
      const flow2 = useVcvShape ? 52 : 55 * Math.exp(-ip2 * 2.2);
      return { paw: paw2, flow: flow2, vol: 380 + 380 * ip2, patientEffort: 1.0 - ip2 };
    } else {
      const ep = (ph - 0.48) / 0.52;
      return { paw: 5.0, flow: -76 * Math.exp(-ep * 4.2), vol: 760 * Math.exp(-ep * 4.2), patientEffort: 0 };
    }
  }

  if (animType === "reverse_trigger") {
    if (ph < 0.25) {
      const ip1 = ph / 0.25;
      const b = getBaseInsp(ip1, 19, 390, false);
      let eff = 0;
      if (ip1 > 0.55) {
        eff = (ip1 - 0.55) / 0.45;
        b.paw -= 3.8 * eff;
        b.flow += 24 * eff;
      }
      return { paw: b.paw, flow: b.flow, vol: b.vol, patientEffort: eff };
    } else if (ph < 0.46) {
      const ip2 = (ph - 0.25) / 0.21;
      const b2 = getBaseInsp(ip2, 25, 220, false);
      return { paw: b2.paw, flow: b2.flow, vol: 390 + b2.vol, patientEffort: 1.0 - ip2 };
    } else {
      const ep = (ph - 0.46) / 0.54;
      return { paw: 5.0, flow: -66 * Math.exp(-ep * 4.2), vol: 610 * Math.exp(-ep * 4.2), patientEffort: 0 };
    }
  }

  if (animType === "sagging") {
    if (ph < 0.34) {
      const ip = ph / 0.34;
      const eff = Math.sin(ip * Math.PI);
      const baseP = 5 + 16 * ip;
      const scoop = 11.5 * Math.pow(eff, 1.3);
      return {
        paw: baseP - scoop,
        flow: 40,
        vol: 400 * ip,
        patientEffort: eff
      };
    } else {
      const ep = (ph - 0.34) / 0.66;
      return { paw: 5.0, flow: -55 * Math.exp(-ep * 4.4), vol: 400 * Math.exp(-ep * 4.4), patientEffort: 0 };
    }
  }

  if (animType === "premature_cycling") {
    if (ph < 0.20) {
      const ip = ph / 0.20;
      const b = getBaseInsp(ip, 18, 380, true);
      return { paw: b.paw, flow: useVcvShape ? 50 : (65 - 28 * ip), vol: 380 * ip, patientEffort: 0.85 };
    } else {
      const ep = (ph - 0.20) / 0.80;
      if (ep < 0.22) {
        const rem = Math.sin((ep / 0.22) * Math.PI);
        return { paw: 5.0 - 3.0 * rem, flow: -45 + 54 * rem, vol: 380 * (1 - ep * 0.4), patientEffort: rem };
      } else {
        const ep2 = (ep - 0.22) / 0.78;
        return { paw: 5.0, flow: -45 * Math.exp(-ep2 * 4.2), vol: 330 * Math.exp(-ep2 * 4.2), patientEffort: 0 };
      }
    }
  }

  if (animType === "delayed_cycling") {
    if (ph < 0.44) {
      const ip = ph / 0.44;
      const b = getBaseInsp(ip, 18, 500, isSpontPs);
      if (ip > 0.70) {
        const sp = (ip - 0.70) / 0.30;
        b.paw += 9.0 * Math.sin(sp * Math.PI * 0.85);
        b.flow -= 25 * sp;
      }
      return { paw: b.paw, flow: b.flow, vol: b.vol, patientEffort: b.effort };
    } else {
      const ep = (ph - 0.44) / 0.56;
      return { paw: 5.0, flow: -60 * Math.exp(-ep * 4.2), vol: 500 * Math.exp(-ep * 4.2), patientEffort: 0 };
    }
  }

  if (animType === "auto_peep") {
    if (ph < 0.36) {
      const b = getBaseInsp(ph / 0.36, 23, 460, isSpontPs);
      return { paw: b.paw, flow: b.flow, vol: b.vol, patientEffort: b.effort };
    } else {
      const ep = (ph - 0.36) / 0.64;
      return {
        paw: 5.0,
        flow: -42 * Math.exp(-ep * 1.1),
        vol: 460 * Math.exp(-ep * 1.45),
        patientEffort: 0
      };
    }
  }

  if (animType === "high_resistance") {
    if (useVcvShape) {
      if (ph < 0.28) {
        const ip = ph / 0.28;
        return { paw: 23 + 15 * ip, flow: 50, vol: 450 * ip, patientEffort: 0 };
      } else if (ph < 0.37) {
        return { paw: 20.0, flow: 0, vol: 450, patientEffort: 0 };
      } else {
        const ep = (ph - 0.37) / 0.63;
        return { paw: 5.0, flow: -26 * Math.exp(-ep * 1.7), vol: 450 * Math.exp(-ep * 2.1), patientEffort: 0 };
      }
    } else {
      if (ph < 0.36) {
        const ip = ph / 0.36;
        return { paw: 5 + 15 * (1 - Math.exp(-ip * 8)), flow: 34 * Math.exp(-ip * 1.2), vol: 340 * ip, patientEffort: 0 };
      } else {
        const ep = (ph - 0.36) / 0.64;
        return { paw: 5.0, flow: -26 * Math.exp(-ep * 1.7), vol: 340 * Math.exp(-ep * 2.0), patientEffort: 0 };
      }
    }
  }

  if (animType === "low_compliance") {
    if (useVcvShape) {
      if (ph < 0.28) {
        const ip = ph / 0.28;
        return { paw: 13 + 24 * ip, flow: 45, vol: 350 * ip, patientEffort: 0 };
      } else if (ph < 0.37) {
        return { paw: 32.0, flow: 0, vol: 350, patientEffort: 0 };
      } else {
        const ep = (ph - 0.37) / 0.63;
        return { paw: 8.0, flow: -72 * Math.exp(-ep * 7.2), vol: 350 * Math.exp(-ep * 7.2), patientEffort: 0 };
      }
    } else {
      if (ph < 0.33) {
        const ip = ph / 0.33;
        return { paw: 8 + 14 * (1 - Math.exp(-ip * 9)), flow: 52 * Math.exp(-ip * 6.5), vol: 260 * (1 - Math.exp(-ip * 6.5)), patientEffort: 0 };
      } else {
        const ep = (ph - 0.33) / 0.67;
        return { paw: 8.0, flow: -58 * Math.exp(-ep * 7.2), vol: 260 * Math.exp(-ep * 7.2), patientEffort: 0 };
      }
    }
  }

  if (animType === "air_leak") {
    if (ph < 0.32) {
      const b = getBaseInsp(ph / 0.32, 16, 480, isSpontPs);
      return { paw: b.paw, flow: b.flow, vol: 480 * (ph / 0.32), patientEffort: b.effort };
    } else {
      const ep = (ph - 0.32) / 0.68;
      return { paw: 4.2, flow: -26 * Math.exp(-ep * 4.5), vol: 240 + 240 * Math.exp(-ep * 4.5), patientEffort: 0 };
    }
  }

  if (animType === "saw_tooth") {
    const saw = Math.sin(tSec * 68) * 2.3 + Math.cos(tSec * 96) * 1.5;
    if (ph < 0.33) {
      const b = getBaseInsp(ph / 0.33, 20, 440, isSpontPs);
      return { paw: b.paw + saw * 0.75, flow: b.flow + saw * 5.8, vol: b.vol, patientEffort: b.effort };
    } else {
      const ep = (ph - 0.33) / 0.67;
      return {
        paw: 5.0 + saw * 0.55,
        flow: -54 * Math.exp(-ep * 4.2) + saw * 6.5,
        vol: 440 * Math.exp(-ep * 4.2),
        patientEffort: 0
      };
    }
  }

  return { paw: 5, flow: 0, vol: 0, patientEffort: 0 };
}

function renderLoop() {
  if (!isPaused) {
    animTime += 0.024;
  }

  const sc = SCENARIOS[currentScenarioIndex];
  if (waveCanvas && ctx && sc) {
    drawAllGraphs(sc.animType, canvasLogicalW, canvasLogicalH);
    updateSVGAnimation(sc.animType);
  }

  requestAnimationFrame(renderLoop);
}

function drawAllGraphs(animType, W, H) {
  ctx.clearRect(0, 0, W, H);

  const tH = (H - 22) / 3;
  const tracks = [
    { label: "Paw (気道内圧)", unit: "cmH2O", top: 6, height: tH - 4, min: -10, max: 45, zeroVal: 0, color: "#facc15", key: "paw" },
    { label: "Flow (流量)", unit: "L/min", top: tH + 8, height: tH - 4, min: -90, max: 90, zeroVal: 0, color: "#38bdf8", key: "flow" },
    { label: "Volume (換気量)", unit: "mL", top: tH * 2 + 10, height: tH - 4, min: -50, max: 850, zeroVal: 0, color: "#4ade80", key: "vol" }
  ];

  const leftPad = 46;
  const plotW = Math.max(100, W - leftPad - 10);
  const timeWindow = 9.6;

  tracks.forEach(tr => {
    ctx.strokeStyle = "#1e293b";
    ctx.lineWidth = 1;
    ctx.strokeRect(leftPad, tr.top, plotW, tr.height);

    const zeroY = tr.top + tr.height - ((tr.zeroVal - tr.min) / (tr.max - tr.min)) * tr.height;
    ctx.strokeStyle = "#475569";
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(leftPad, zeroY);
    ctx.lineTo(leftPad + plotW, zeroY);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = tr.color;
    ctx.font = "bold 11px sans-serif";
    ctx.fillText(`${tr.label} [${tr.unit}]`, leftPad + 6, tr.top + 14);

    ctx.fillStyle = "#94a3b8";
    ctx.font = "9.5px monospace";
    ctx.fillText(tr.max, 4, tr.top + 10);
    ctx.fillText(tr.zeroVal, 10, zeroY + 3);
    ctx.fillText(tr.min, 4, tr.top + tr.height - 2);

    if (isNormalOverlay && !isResolved) {
      ctx.save();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.55)";
      ctx.lineWidth = 2.2;
      ctx.setLineDash([]);
      ctx.beginPath();
      for (let x = 0; x <= plotW; x += 2) {
        const sampleTime = animTime - timeWindow + (x / plotW) * timeWindow;
        const valObj = computeBreathWaveforms(Math.max(0, sampleTime), animType, true, currentMode, currentCtrl);
        const val = valObj[tr.key];
        const y = tr.top + tr.height - ((val - tr.min) / (tr.max - tr.min)) * tr.height;
        const clampedY = Math.max(tr.top + 2, Math.min(tr.top + tr.height - 2, y));
        if (x === 0) ctx.moveTo(leftPad + x, clampedY);
        else ctx.lineTo(leftPad + x, clampedY);
      }
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.strokeStyle = tr.color;
    ctx.lineWidth = 1.45;
    ctx.beginPath();
    for (let x = 0; x <= plotW; x += 1.5) {
      const sampleTime = animTime - timeWindow + (x / plotW) * timeWindow;
      const valObj = computeBreathWaveforms(Math.max(0, sampleTime), animType, isResolved, currentMode, currentCtrl);
      const val = valObj[tr.key];
      const y = tr.top + tr.height - ((val - tr.min) / (tr.max - tr.min)) * tr.height;
      const clampedY = Math.max(tr.top + 2, Math.min(tr.top + tr.height - 2, y));
      if (x === 0) ctx.moveTo(leftPad + x, clampedY);
      else ctx.lineTo(leftPad + x, clampedY);
    }
    ctx.stroke();
    ctx.restore();
  });
}

function updateSVGAnimation(animType) {
  const nowWave = computeBreathWaveforms(animTime, animType, isResolved, currentMode, currentCtrl);
  const type = isResolved ? "normal" : animType;

  const svgLungScale = document.getElementById("svgLungScale");
  const svgLungUpper = document.getElementById("svgLungUpper");
  const svgLungLower = document.getElementById("svgLungLower");
  const svgLungSubText = document.getElementById("svgLungSubText");
  const svgDiaphragm = document.getElementById("svgDiaphragm");
  const svgEffortBadge = document.getElementById("svgEffortBadge");
  const svgFlowDot = document.getElementById("svgFlowDot");
  const svgLeakEffect = document.getElementById("svgLeakEffect");
  const svgStenosisEffect = document.getElementById("svgStenosisEffect");
  const svgBubbles = document.getElementById("svgBubbles");
  const svgWaterTrap = document.getElementById("svgWaterTrap");

  if (!svgLungScale) return;

  const scaleVal = 0.88 + Math.max(0, Math.min(1.5, nowWave.vol / 450)) * 0.28;
  svgLungScale.setAttribute("transform", `scale(${scaleVal.toFixed(2)}, ${scaleVal.toFixed(2)})`);

  const strokeW = (type === "low_compliance") ? "5.5" : "2.5";
  if (svgLungUpper) svgLungUpper.setAttribute("stroke-width", strokeW);
  if (svgLungLower) svgLungLower.setAttribute("stroke-width", strokeW);

  if (svgLungSubText) {
    if (type === "low_compliance") svgLungSubText.textContent = "硬化肺 (C↓・高Pplat)";
    else if (type === "auto_peep") svgLungSubText.textContent = "過膨張 (Auto-PEEP)";
    else svgLungSubText.textContent = isResolved ? "同調・換気良好" : "";
  }

  const pull = nowWave.patientEffort * 26;
  if (svgDiaphragm) {
    svgDiaphragm.setAttribute("d", `M 552 30 Q ${526 + pull} 92, 552 156`);
  }
  if (svgEffortBadge) {
    svgEffortBadge.textContent = nowWave.patientEffort > 0.2 ? "⚡ 吸気努力あり!" : "自発吸気努力";
    svgEffortBadge.setAttribute("fill", nowWave.patientEffort > 0.2 ? "#facc15" : "#94a3b8");
  }

  if (svgFlowDot) {
    if (nowWave.flow > 5) {
      const prog = (animTime * 2.4) % 1;
      svgFlowDot.setAttribute("cx", 170 + prog * 210);
      svgFlowDot.setAttribute("cy", 78);
      svgFlowDot.setAttribute("fill", "#38bdf8");
    } else {
      const prog = (animTime * 2.0) % 1;
      svgFlowDot.setAttribute("cx", 380 - prog * 240);
      svgFlowDot.setAttribute("cy", 136);
      svgFlowDot.setAttribute("fill", "#4ade80");
    }
  }

  if (svgLeakEffect) svgLeakEffect.setAttribute("opacity", type === "air_leak" ? "1" : "0");
  if (svgStenosisEffect) svgStenosisEffect.setAttribute("opacity", type === "high_resistance" ? "1" : "0");
  if (svgBubbles) {
    const showBubble = (type === "saw_tooth" || type === "auto_trigger");
    svgBubbles.setAttribute("opacity", showBubble ? "1" : "0");
    if (showBubble) {
      const jitter = Math.sin(animTime * 42) * 2.5;
      svgBubbles.setAttribute("transform", `translate(0, ${jitter})`);
    }
  }
  if (svgWaterTrap) {
    const highWater = (type === "saw_tooth" || type === "auto_trigger");
    svgWaterTrap.setAttribute("y", highWater ? "150" : "166");
    svgWaterTrap.setAttribute("height", highWater ? "30" : "14");
    svgWaterTrap.setAttribute("opacity", highWater ? "0.9" : "0.45");
  }
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", () => {
    resizeCanvasSafely();
    initSimulator();
  });
} else {
  resizeCanvasSafely();
  initSimulator();
}
</script>
</body>
</html>
